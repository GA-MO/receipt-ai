<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model & Cost — Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f3f2ef; --text:#1d1d1f; --dim:#6e6e73; --dim2:#a6a6ad; --hair:rgba(0,0,0,.09);
    --gd-a:#0fa371; --gd-b:#059669;
    --sans:'Inter','Anuphan',-apple-system,system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--sans);color:var(--text);background:#e9e8e4;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  #scaler{width:1600px;height:900px;transform-origin:center center;}
  .slide{
    width:1600px;height:900px;background:var(--bg);padding:72px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
    background-image:radial-gradient(900px 640px at 50% 118%, rgba(16,185,129,.13), transparent 60%);
    box-shadow:0 40px 120px -40px rgba(0,0,0,.5);
  }
  .eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:center;}
  h1{font-family:var(--mono);font-size:46px;font-weight:700;text-align:center;margin-top:12px;
     background:linear-gradient(110deg,var(--gd-b),var(--gd-a));-webkit-background-clip:text;background-clip:text;color:transparent;}

  .row{display:grid;grid-template-columns:repeat(3,1fr);margin-top:64px;}
  .cell{text-align:center;position:relative;}
  .cell:not(:last-child)::after{content:"";position:absolute;right:0;top:18%;height:64%;width:1px;background:var(--hair);}
  .cell .ico{font-size:32px;}
  .cell .v{font-family:var(--mono);font-size:88px;font-weight:700;line-height:1;margin-top:14px;
    background:linear-gradient(180deg,var(--gd-b),var(--gd-a));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .cell .u{font-size:20px;color:var(--text);font-weight:600;margin-top:14px;}
  .cell .u span{color:var(--dim);font-weight:400;}

  .foot{text-align:center;margin-top:66px;font-size:17px;color:var(--dim);font-weight:500;}
  .foot b{color:var(--text);font-weight:700;}
</style>
</head>
<body>
<div id="scaler">
  <div class="slide">

    <div class="eyebrow">Model ที่เลือก</div>
    <h1>gemini-3.1-flash-lite</h1>

    <div class="row">
      <div class="cell">
        <div class="ico">💰</div>
        <div class="v">$0.002</div>
        <div class="u">ต่อใบ <span>(~0.07฿)</span></div>
      </div>
      <div class="cell">
        <div class="ico">⚡</div>
        <div class="v">3.3s</div>
        <div class="u">ต่อใบ <span>(1 vision call)</span></div>
      </div>
      <div class="cell">
        <div class="ico">🎯</div>
        <div class="v">96%</div>
        <div class="u">ความแม่นยำ</div>
      </div>
    </div>

    <div class="foot">เลือกหลังเทสต์จริง <b>13 model</b> ข้ามค่าย</div>

  </div>
</div>

<script>
  var scaler=document.getElementById('scaler');
  function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);scaler.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
