[project]
name = "thai-receipt-intelligence"
version = "0.1.0"
description = "AI-powered Thai receipt and sales document extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "google-genai>=1.14.0",
    "google-auth>=2.38.0",
    "pillow>=11.0.0",
    "rapidfuzz>=3.9.0",
    "arq>=0.26.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]
