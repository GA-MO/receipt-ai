# Two containers, no broker. Extraction runs in the API process on a thread
# pool sized by EXTRACTION_CONCURRENCY; work stranded by a restart is picked
# back up from the database at boot (see requeue_stuck_documents). arq/Redis
# remains supported — set USE_ARQ=true and run `arq app.worker.WorkerSettings`
# — but a single internal box does not need the extra moving parts.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    # Reached only through the frontend's nginx (/api/), so no published port.
    environment:
      - DATABASE_URL=sqlite:///./data/receipts.db
      - UPLOAD_DIR=./uploads
      - CORS_ORIGINS=http://localhost
      - USE_ARQ=false
      - EXTRACTION_CONCURRENCY=8
      - TZ=Asia/Bangkok
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # In-flight extractions finish on SIGTERM; anything still queued is
    # requeued at the next boot rather than dropped.
    stop_grace_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
    volumes:
      # Shared password for the internal test box. Generate with:
      #   htpasswd -bc deploy/htpasswd boss 'a-password'
      - ./deploy/htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  backend-uploads:
