# Internal test deployment — one container, no broker.
#
# Extraction runs inside the API process on a thread pool, so there is nothing
# to share a SQLite file with. The Deployment is still pinned to one replica
# with the Recreate strategy: a ReadWriteOnce PVC attaches to one pod, and two
# pods on one SQLite file corrupt it rather than scale it.
#
# That ceiling is deliberate for a box the boss is trying out. Before real reps
# use this, move to Postgres + object storage; extraction can then move back
# out to its own scalable Deployment (arq/Redis is still supported — set
# USE_ARQ=true).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: receipt-ai-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # receipts.db plus the original photos, kept as audit evidence. Real
      # phone photos measure ~1.9 MB, so this holds roughly 10k receipts.
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: receipt-ai-config
data:
  DATABASE_URL: "sqlite:////app/data/receipts.db"
  UPLOAD_DIR: "/app/uploads"
  CORS_ORIGINS: "http://receipt-ai.internal"
  USE_ARQ: "false"
  EXTRACTION_CONCURRENCY: "8"
  LOG_LEVEL: "INFO"
  TZ: "Asia/Bangkok"
---
# kubectl create secret generic receipt-ai-secrets \
#   --from-literal=OPENROUTER_API_KEY=sk-or-v1-...
# Committing the real values would put the API key in git history.
apiVersion: v1
kind: Secret
metadata:
  name: receipt-ai-secrets
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-ai
spec:
  replicas: 1 # SQLite: a second replica corrupts the database, it does not scale it
  strategy:
    type: Recreate # never two pods on one database file, not even for a moment
  selector:
    matchLabels: { app: receipt-ai }
  template:
    metadata:
      labels: { app: receipt-ai }
    spec:
      # Migrations run before the API starts, so it never serves against a
      # half-migrated schema.
      initContainers:
        - name: migrate
          image: receipt-ai-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: receipt-ai-config }
            - secretRef: { name: receipt-ai-secrets }
          volumeMounts:
            - { name: data, mountPath: /app/data, subPath: data }
      containers:
        - name: api
          image: receipt-ai-backend:latest
          args:
            - uvicorn
            - app.main:app
            - --host=0.0.0.0
            - --port=8000
            - --proxy-headers
          env:
            - name: RUN_MIGRATIONS # the initContainer already did it
              value: "false"
          envFrom:
            - configMapRef: { name: receipt-ai-config }
            - secretRef: { name: receipt-ai-secrets }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - { name: data, mountPath: /app/data, subPath: data }
            - { name: data, mountPath: /app/uploads, subPath: uploads }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      # An extraction takes ~30s; let in-flight work finish on SIGTERM. Whatever
      # does not make it is requeued from the database at the next boot.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: receipt-ai-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend # the frontend's nginx proxies to http://backend:8000
spec:
  selector: { app: receipt-ai }
  ports:
    - port: 8000
      targetPort: 8000
