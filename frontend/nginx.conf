server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Shared password for the internal test box — one credential for the team,
    # not a user system. Mounted from ./deploy/htpasswd by compose (or from an
    # Ingress annotation on k8s).
    auth_basic "Thai Receipt Intelligence";
    auth_basic_user_file /etc/nginx/htpasswd;

    # SPA: fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Probes must answer without a password, or the platform reads 401 as down.
    location = /api/health {
        auth_basic off;
        proxy_pass http://backend:8000/api/health;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
