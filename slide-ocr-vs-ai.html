<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCR vs AI — Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f3f2ef; --text:#1d1d1f; --dim:#6e6e73; --dim2:#a6a6ad;
    --hair:rgba(0,0,0,.09);
    --sl-a:#475569; --sl-tint:rgba(71,85,105,.07); --sl-line:rgba(71,85,105,.26);
    --gd-a:#0fa371; --gd-b:#059669; --gd-tint:rgba(16,185,129,.09); --gd-line:rgba(16,185,129,.30);
    --sans:'Inter','Anuphan',-apple-system,system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--sans);color:var(--text);background:#e9e8e4;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
  #scaler{width:1600px;height:900px;transform-origin:center center;}
  .slide{
    width:1600px;height:900px;background:var(--bg);padding:72px;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    background-image:
      radial-gradient(760px 520px at 6% -10%, rgba(71,85,105,.08), transparent 60%),
      radial-gradient(820px 600px at 98% 110%, rgba(16,185,129,.13), transparent 60%);
    box-shadow:0 40px 120px -40px rgba(0,0,0,.5);
  }
  .eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:center;}
  h1{font-size:60px;font-weight:800;line-height:1.04;letter-spacing:-.03em;margin-top:10px;text-align:center;}
  h1 .ocr{color:var(--sl-a);}
  h1 .grad{background:linear-gradient(110deg,var(--gd-b),var(--gd-a));-webkit-background-clip:text;background-clip:text;color:transparent;}
  h1 .vs{color:var(--dim2);font-weight:600;}

  .cmp{flex:1;display:grid;grid-template-columns:1fr 70px 1fr;align-items:stretch;margin:36px 0 0;}
  .col{border-radius:26px;border:1.5px solid;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .col.ocr{background:linear-gradient(180deg,var(--sl-tint),rgba(71,85,105,.015));border-color:var(--sl-line);}
  .col.ai{background:linear-gradient(180deg,var(--gd-tint),rgba(16,185,129,.02));border-color:var(--gd-line);}
  .col .ico{font-size:56px;line-height:1;}
  .col .htag{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-top:16px;}
  .ocr .htag{color:var(--sl-a);} .ai .htag{color:var(--gd-b);}
  .big{font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:14px 0 22px;}
  .ocr .big{color:var(--sl-a);}
  .ai .big{background:linear-gradient(110deg,var(--gd-b),var(--gd-a));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .ex{font-size:20px;color:var(--dim);line-height:1.5;max-width:24ch;}
  .ex .q{font-family:var(--mono);font-size:18px;color:var(--text);background:rgba(0,0,0,.05);border-radius:8px;padding:3px 10px;}
  .ai .ex .q{color:var(--gd-b);background:var(--gd-tint);}

  .vsmid{display:flex;align-items:center;justify-content:center;}
  .vsmid span{font-family:var(--mono);font-size:14px;letter-spacing:.18em;color:var(--dim2);text-transform:uppercase;}

  .verdict{text-align:center;margin-top:30px;font-size:18px;color:var(--dim);font-weight:500;}
  .verdict b{color:var(--text);font-weight:700;} .verdict .num{font-family:var(--mono);color:var(--sl-a);font-weight:700;}
</style>
</head>
<body>
<div id="scaler">
  <div class="slide">

    <div class="eyebrow">เทคโนโลยีอ่านใบเสร็จ</div>
    <h1><span class="ocr">OCR</span> <span class="vs">vs</span> <span class="grad">AI</span></h1>

    <div class="cmp">
      <div class="col ocr">
        <div class="ico">📄</div>
        <div class="htag">OCR</div>
        <div class="big">ได้แค่<br/>“ตัวอักษร”</div>
        <div class="ex"><span class="q">“สิงห์ x2”</span><br/>ต้องเขียน rule แปลเป็นสินค้าเอง</div>
      </div>

      <div class="vsmid"><span>vs</span></div>

      <div class="col ai">
        <div class="ico">🤖</div>
        <div class="htag">AI · Vision</div>
        <div class="big">ได้<br/>“ความหมาย”</div>
        <div class="ex"><span class="q">(product, qty)</span><br/>จับคู่ catalog ให้ในตัว</div>
      </div>
    </div>

    <div class="verdict">📊 เอา OCR มาเสริมก็ไม่ช่วย — accuracy เท่า <b>AI อย่างเดียว</b> แต่ช้ากว่า <span class="num">~4×</span></div>

  </div>
</div>

<script>
  var scaler=document.getElementById('scaler');
  function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);scaler.style.transform='scale('+s+')';}
  window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
